<h1>Road Repair Requests</h1>

<input id="title" placeholder="Problem title"><br>
<input id="address" placeholder="Address"><br>
<textarea id="description" placeholder="Description"></textarea><br>
<button onclick="add()">Send request</button>

<ul id="list"></ul>

<script>
async function load() {
  const res = await fetch("/requests");
  const data = await res.json();
  document.getElementById("list").innerHTML =
    data.map(r =>
      `<li>
        <b>${r.title}</b> (${r.status})<br>
        ${r.address}<br>
        ${r.description}
      </li>`
    ).join("");
}

async function add() {
  await fetch("/requests", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      title: title.value,
      address: address.value,
      description: description.value
    })
  });
  load();
}

load();
</script>
